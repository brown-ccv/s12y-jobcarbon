# See METHODOLOGY.md for the carbon estimation approach this pipeline implements.
name: ~
description: ~
aggregation:
  metrics:
    - duration
    - power
    - carbon_operational
    - carbon_embodied
    - carbon
  type: both
pipeline:
  compute:
    - cpu-share
    - mem-share
    - weight-cpu-share
    - weight-mem-share
    - reservation-share
    - scale-host-power
    - sum-node-gpu-power
    - duration-to-hours
    - calculate-energy
    - sci-o
    - server-embodied
    - gpu-embodied-pcf
    - gpu-embodied-per-second
    - gpu-embodied-time-scale
    - sci-m
    - sum-carbon
initialize:
  plugins:

    cpu-share:
      path: builtin
      method: Divide
      config:
        numerator: cpu_allocated
        denominator: cpu_total
        output: cpu_share

    mem-share:
      path: builtin
      method: Divide
      config:
        numerator: mem_allocated
        denominator: mem_total
        output: mem_share

    weight-cpu-share:
      path: builtin
      method: Coefficient
      config:
        input-parameter: cpu_share
        coefficient: 0.7
        output-parameter: weighted_cpu_share

    weight-mem-share:
      path: builtin
      method: Coefficient
      config:
        input-parameter: mem_share
        coefficient: 0.3
        output-parameter: weighted_mem_share

    reservation-share:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - weighted_cpu_share
          - weighted_mem_share
        output-parameter: reservation_share

    scale-host-power:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - host_power
          - reservation_share
        output-parameter: scaled_host_power_kw

    sum-node-gpu-power:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - scaled_host_power_kw
          - gpu_power
        output-parameter: node_power_kw

    duration-to-hours:
      path: builtin
      method: Coefficient
      config:
        input-parameter: duration
        coefficient: "=1/3600"
        output-parameter: duration_hours

    calculate-energy:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - duration_hours
          - node_power_kw
        output-parameter: power
      parameter-metadata:
        outputs:
          power:
            unit: kWh
            description: Node energy consumed during the observation interval
            aggregation-method:
              time: sum
              component: sum

    sci-o:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - grid_carbon_intensity
          - power
        output-parameter: carbon_operational
      parameter-metadata:
        outputs:
          carbon_operational:
            unit: gCO2eq
            description: Operational carbon emissions from energy use
            aggregation-method:
              time: sum
              component: sum

    server-embodied:
      path: builtin
      method: SciEmbodied
      config:
        lifespan: "=cpu_lifespan_seconds*1"
        output-parameter: server_embodied_carbon
      mapping:
        vCPUs: cpu_allocated
        memory: mem_allocated
      parameter-metadata:
        outputs:
          server_embodied_carbon:
            unit: gCO2eq
            description: Embodied carbon attributed to server hardware
            aggregation-method:
              time: sum
              component: sum

    gpu-embodied-pcf:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - pcf_carbon_per_gpu
          - gpu_count
        output-parameter: gpu_embodied_carbon_node
      parameter-metadata:
        outputs:
          gpu_embodied_carbon_node:
            unit: gCO2eq
            description: Total GPU embodied carbon for all GPUs on the node
            aggregation-method:
              time: copy
              component: sum

    gpu-embodied-per-second:
      path: builtin
      method: Coefficient
      config:
        input-parameter: gpu_embodied_carbon_node
        coefficient: "=1/157680000"
        output-parameter: gpu_embodied_carbon_per_second
      parameter-metadata:
        outputs:
          gpu_embodied_carbon_per_second:
            unit: gCO2eq/s
            description: GPU embodied carbon amortised per second of lifespan
            aggregation-method:
              time: copy
              component: sum

    gpu-embodied-time-scale:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - gpu_embodied_carbon_per_second
          - duration
        output-parameter: gpu_embodied_carbon
      parameter-metadata:
        outputs:
          gpu_embodied_carbon:
            unit: gCO2eq
            description: GPU embodied carbon attributed to the observation duration
            aggregation-method:
              time: sum
              component: sum

    sci-m:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - server_embodied_carbon
          - gpu_embodied_carbon
        output-parameter: carbon_embodied
      parameter-metadata:
        outputs:
          carbon_embodied:
            unit: gCO2eq
            description: Total embodied carbon for the observation interval
            aggregation-method:
              time: sum
              component: sum

    sum-carbon:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - carbon_operational
          - carbon_embodied
        output-parameter: carbon
      parameter-metadata:
        outputs:
          carbon:
            unit: gCO2eq
            description: Total carbon emissions (operational + embodied)
            aggregation-method:
              time: sum
              component: sum

tree:
  children:
    ~: ~
