name: full-example
description: Test manifest based on full.yaml
aggregation:
  metrics:
    - duration
    - power
    - carbon_operational
    - carbon_embodied
    - carbon
  type: both
initialize:
  plugins:
    sum-scaph-power:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - cpu_power_kw
          - dram_power_kw
        output-parameter: kilowatts
    duration-to-hours:
      path: builtin
      method: Coefficient
      config:
        input-parameter: duration
        coefficient: "=1/3600"
        output-parameter: duration_hours
    calculate-energy:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - duration_hours
          - kilowatts
        output-parameter: power
      parameter-metadata:
        outputs:
          power:
            description: Energy consumed per observation interval
            unit: kWh
            aggregation-method:
              time: avg
              component: sum
    sci-o:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - grid_carbon_intensity
          - power
        output-parameter: carbon_operational
      parameter-metadata:
        outputs:
          carbon_operational:
            description: Operational carbon emissions
            unit: gCO2eq
            aggregation-method:
              time: sum
              component: sum
    sci-m:
      path: builtin
      method: SciEmbodied
      config:
        lifespan: 157680000
        output-parameter: carbon_embodied
      mapping:
        vCPUs: cpu_count
        memory: memory_gb
      parameter-metadata:
        outputs:
          carbon_embodied:
            description: Embodied carbon emissions
            unit: gCO2eq
            aggregation-method:
              time: sum
              component: sum
    sum-carbon:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - carbon_operational
          - carbon_embodied
        output-parameter: carbon
      parameter-metadata:
        outputs:
          carbon:
            description: Total carbon emissions
            unit: gCO2eq
            aggregation-method:
              time: sum
              component: sum
pipeline:
  compute:
    - sum-scaph-power
    - duration-to-hours
    - calculate-energy
    - sci-o
    - sci-m
    - sum-carbon
tree:
  children:
    testnode:
      defaults:
        grid_carbon_intensity: 381
        duration: 60
      inputs:
        - timestamp: 2023-01-01T00:00:00Z
          duration: 60
          cpu_power_kw: 0.1
          dram_power_kw: 0.01
          grid_carbon_intensity: 381
        - timestamp: 2023-01-01T00:01:00Z
          duration: 60
          cpu_power_kw: 0.12
          # dram_power_kw missing here intentionally
          grid_carbon_intensity: 381
