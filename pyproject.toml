[project]
name = "jobcarbon"
version = "1.2.1"
description = "generate Impact Framework observations from OSCAR jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "tomlkit>=0.14.0",
    "typer>=0.24.1",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.9.4",
    "pytest>=8.0",
    "responses>=0.25",
    "docformatter>=1.7.8",
]

[project.scripts]
jobcarbon = "jobcarbon:app"
jobcarbon-create-config = "jobcarbon.create_config:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobcarbon"]

