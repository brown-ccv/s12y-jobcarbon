[project]
name = "jobcarbon"
version = "0.1.0"
description = "generate Impact Framework observations from OSCAR jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "tomlkit>=0.14.0",
    "typer>=0.24.1",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.9.4",
    "pytest>=8.0",
    "responses>=0.25",
]

[project.scripts]
jobcarbon = "jobcarbon:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobcarbon"]

[tool.hatch.build.targets.wheel.shared-data]
# TODO(@broarr): This should be plugins not templates
# Install templates to the standard data prefix so Spack/system installs
# land them under {prefix}/share/jobcarbon/templates/
"src/templates" = "share/jobcarbon/templates"

[tool.pytest.ini_options]
pythonpath = ["src"]
