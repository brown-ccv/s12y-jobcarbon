name: test-template-host-only-gpu-est
description: Generated test manifest from template
aggregation:
  metrics:
    - duration
    - power
    - carbon_operational
    - carbon_embodied
    - carbon
  type: both
pipeline:
  compute:
    - cpu-share
    - mem-share
    - weight-cpu-share
    - weight-mem-share
    - reservation-share
    - scale-host-power
    - sum-node-gpu-power
    - duration-to-hours
    - calculate-energy
    - sci-o
    - sci-m
    - gpu-yield-correct
    - gpu-chip-embodied
    - gpu-vram-embodied
    - gpu-embodied-per-gpu
    - gpu-embodied-node
    - sum-carbon
initialize:
  plugins:

    cpu-share:
      path: builtin
      method: Divide
      config:
        numerator: cpu_allocated
        denominator: cpu_total
        output: cpu_share

    mem-share:
      path: builtin
      method: Divide
      config:
        numerator: mem_allocated
        denominator: mem_total
        output: mem_share

    weight-cpu-share:
      path: builtin
      method: Coefficient
      config:
        input-parameter: cpu_share
        coefficient: 0.7
        output-parameter: weighted_cpu_share

    weight-mem-share:
      path: builtin
      method: Coefficient
      config:
        input-parameter: mem_share
        coefficient: 0.3
        output-parameter: weighted_mem_share

    reservation-share:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - weighted_cpu_share
          - weighted_mem_share
        output-parameter: reservation_share

    scale-host-power:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - host_power_watts
          - reservation_share
        output-parameter: scaled_host_power_watts

    sum-node-gpu-power:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - scaled_host_power_watts
          - gpu_power_watts
        output-parameter: node_power_watts

    duration-to-hours:
      path: builtin
      method: Coefficient
      config:
        input-parameter: duration
        coefficient: "=1/3600"
        output-parameter: duration_hours

    calculate-energy:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - duration_hours
          - kilowatts
        output-parameter: power
      parameter-metadata:
        outputs:
          power:
            description: Energy consumed per observation interval
            unit: kWh
            aggregation-method:
              time: avg
              component: sum

    sci-o:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - grid_carbon_intensity
          - power
        output-parameter: carbon_operational
      parameter-metadata:
        outputs:
          carbon_operational:
            description: Operational carbon emissions
            unit: gCO2eq
            aggregation-method:
              time: sum
              component: sum

    sci-m:
      path: builtin
      method: SciEmbodied
      config:
        lifespan: 157680000
        output-parameter: carbon_embodied
      mapping:
        vCPUs: cpu_allocated
        memory: mem_allocated
      parameter-metadata:
        outputs:
          carbon_embodied:
            description: CPU and server embodied carbon (GPU excluded; added separately)
            unit: gCO2eq
            aggregation-method:
              time: sum
              component: sum

    # GPU embodied carbon — estimated path (per-node scalar lookup + yield correction)
    # Sources: Boakes et al. IEDM 2023 (process scalars, yield-corrected at 90%),
    #          Li, Graif, Gupta NeurIPS 2024 (memory scalars)
    # process_scalar_gco2eq_per_cm2 and mem_scalar_gco2eq_per_gb are injected into
    # defaults by the generator (resolved from process_nm and mem_type via gpu_config.py).

    gpu-yield-correct:
      path: builtin
      method: Coefficient
      config:
        input-parameter: die_area_cm2
        coefficient: "=1/0.9"
        output-parameter: die_area_cm2_yield_corrected
      parameter-metadata:
        outputs:
          die_area_cm2_yield_corrected:
            description: >
              Die area in cm² adjusted for 90% manufacturing yield — allocates full
              wafer carbon to functional dies only
            unit: cm2

    gpu-chip-embodied:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - die_area_cm2_yield_corrected
          - process_scalar_gco2eq_per_cm2
        output-parameter: chip_embodied_gco2eq
      parameter-metadata:
        outputs:
          chip_embodied_gco2eq:
            description: GPU chip manufacturing embodied carbon per GPU
            unit: gCO2eq

    gpu-vram-embodied:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - vram_gb
          - mem_scalar_gco2eq_per_gb
        output-parameter: vram_embodied_gco2eq
      parameter-metadata:
        outputs:
          vram_embodied_gco2eq:
            description: GPU VRAM manufacturing embodied carbon per GPU
            unit: gCO2eq

    gpu-embodied-per-gpu:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - chip_embodied_gco2eq
          - vram_embodied_gco2eq
        output-parameter: gpu_embodied_gco2eq_per_gpu
      parameter-metadata:
        outputs:
          gpu_embodied_gco2eq_per_gpu:
            description: Total GPU embodied carbon per GPU (chip + VRAM)
            unit: gCO2eq

    gpu-embodied-node:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - gpu_embodied_gco2eq_per_gpu
          - gpu_count
        output-parameter: gpu_embodied_gco2eq_node
      parameter-metadata:
        outputs:
          gpu_embodied_gco2eq_node:
            description: Total GPU embodied carbon for all GPUs on this node
            unit: gCO2eq

    sum-carbon:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - carbon_operational
          - carbon_embodied
          - gpu_embodied_gco2eq
        output-parameter: carbon
      parameter-metadata:
        outputs:
          carbon:
            description: Total carbon emissions (operational + CPU/server embodied + GPU embodied)
            unit: gCO2eq
            aggregation-method:
              time: sum
              component: sum

tree:
  children:
    ~:
      defaults:
        grid_carbon_intensity: 381
        duration: 60
        cpu_power: 0
        dram_power: 0
        gpu_power: 0
        host_power: 0
