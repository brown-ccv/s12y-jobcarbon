# See METHODOLOGY.md for the carbon estimation approach this pipeline implements.
name: ~
description: ~
aggregation:
  metrics:
    - duration
    - power
    - carbon_operational
    - carbon_embodied
    - carbon
  type: both
pipeline:
  compute:
    - sum-scaph-power
    - duration-to-hours
    - calculate-energy
    - sci-o
    - sci-m
    - sum-carbon
initialize:
  plugins:

    sum-scaph-power:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - cpu_power
          - dram_power
        output-parameter: node_power_kw

    duration-to-hours:
      path: builtin
      method: Coefficient
      config:
        input-parameter: duration
        coefficient: "=1/3600"
        output-parameter: duration_hours

    calculate-energy:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - duration_hours
          - node_power_kw
        output-parameter: power
      parameter-metadata:
        outputs:
          power:
            unit: kWh
            description: Node energy consumed during the observation interval
            aggregation-method:
              time: sum
              component: sum

    sci-o:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - grid_carbon_intensity
          - power
        output-parameter: carbon_operational
      parameter-metadata:
        outputs:
          carbon_operational:
            unit: gCO2eq
            description: Operational carbon emissions from energy use
            aggregation-method:
              time: sum
              component: sum

    sci-m:
      path: builtin
      method: SciEmbodied
      config:
        lifespan: "=cpu_lifespan_seconds*1"
        output-parameter: carbon_embodied
      mapping:
        vCPUs: cpu_allocated
        memory: mem_allocated
      parameter-metadata:
        outputs:
          carbon_embodied:
            unit: gCO2eq
            description: Total embodied carbon for the observation interval
            aggregation-method:
              time: sum
              component: sum

    sum-carbon:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - carbon_operational
          - carbon_embodied
        output-parameter: carbon
      parameter-metadata:
        outputs:
          carbon:
            unit: gCO2eq
            description: Total carbon emissions (operational + embodied)
            aggregation-method:
              time: sum
              component: sum

tree:
  children:
    ~: ~
