name: ~
description: ~
aggregation:
  metrics:
    - duration
    - power
    - carbon_operational
    - carbon_embodied
    - carbon
  type: both
pipeline:
  compute:
    - cpu-microwatts-to-watts
    - dram-microwatts-to-watts
    - gpu-microwatts-to-watts
    - sum-scaph-gpu-power
    - duration-to-hours
    - watts-to-kw
    - calculate-energy
    - sci-o
    - mem-bytes-to-gb
    - sci-m
    - gpu-yield-correct
    - gpu-chip-embodied
    - gpu-vram-embodied
    - gpu-embodied-per-gpu-kg
    - gpu-embodied-node-kg
    - gpu-embodied-node-g
    - sum-carbon
initialize:
  plugins:
    cpu-microwatts-to-watts:
      path: builtin
      method: Coefficient
      config:
        input-parameter: cpu_power
        coefficient: "=1/1000000"
        output-parameter: cpu_power_watts

    dram-microwatts-to-watts:
      path: builtin
      method: Coefficient
      config:
        input-parameter: dram_power
        coefficient: "=1/1000000"
        output-parameter: dram_power_watts

    gpu-microwatts-to-watts:
      path: builtin
      method: Coefficient
      config:
        input-parameter: gpu_power
        coefficient: "=1/1000000"
        output-parameter: gpu_power_watts

    sum-scaph-gpu-power:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - cpu_power_watts
          - dram_power_watts
          - gpu_power_watts
        output-parameter: node_power_watts

    duration-to-hours:
      path: builtin
      method: Coefficient
      config:
        input-parameter: duration
        coefficient: "=1/3600"
        output-parameter: duration_hours

    watts-to-kw:
      path: builtin
      method: Coefficient
      config:
        input-parameter: node_power_watts
        coefficient: "=1/1000"
        output-parameter: kilowatts

    calculate-energy:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - duration_hours
          - kilowatts
        output-parameter: power
      parameter-metadata:
        outputs:
          power:
            description: Energy consumed per observation interval
            unit: kWh
            aggregation-method:
              time: avg
              component: sum

    sci-o:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - grid_carbon_intensity
          - power
        output-parameter: carbon_operational
      parameter-metadata:
        outputs:
          carbon_operational:
            description: Operational carbon emissions
            unit: gCO2eq
            aggregation-method:
              time: sum
              component: sum

    mem-bytes-to-gb:
      path: builtin
      method: Coefficient
      config:
        input-parameter: mem_allocated
        coefficient: "=1/1073741824"
        output-parameter: memory_gb

    sci-m:
      path: builtin
      method: SciEmbodied
      config:
        lifespan: 157680000
        output-parameter: carbon_embodied
      mapping:
        vCPUs: cpu_allocated
        memory: memory_gb
      parameter-metadata:
        outputs:
          carbon_embodied:
            description: CPU and server embodied carbon (GPU excluded; added separately)
            unit: gCO2eq
            aggregation-method:
              time: sum
              component: sum

    # GPU embodied carbon — estimated path (per-node scalar lookup + yield correction)
    # Sources: Boakes et al. IEDM 2023 (process scalars, yield-corrected at 90%),
    #          Li, Graif, Gupta NeurIPS 2024 (memory scalars)
    # process_scalar_kgco2eq_per_cm2 and mem_scalar_kgco2eq_per_gb are injected into
    # defaults by the generator (resolved from process_nm and mem_type via gpu_config.py).

    gpu-yield-correct:
      path: builtin
      method: Coefficient
      config:
        input-parameter: die_area_cm2
        coefficient: "=1/0.9"
        output-parameter: die_area_cm2_yield_corrected
      parameter-metadata:
        outputs:
          die_area_cm2_yield_corrected:
            description: >
              Die area in cm² adjusted for 90% manufacturing yield — allocates full
              wafer carbon to functional dies only
            unit: cm2

    gpu-chip-embodied:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - die_area_cm2_yield_corrected
          - process_scalar_kgco2eq_per_cm2
        output-parameter: chip_embodied_kgco2eq
      parameter-metadata:
        outputs:
          chip_embodied_kgco2eq:
            description: GPU chip manufacturing embodied carbon per GPU
            unit: kgCO2eq

    gpu-vram-embodied:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - vram_gb
          - mem_scalar_kgco2eq_per_gb
        output-parameter: vram_embodied_kgco2eq
      parameter-metadata:
        outputs:
          vram_embodied_kgco2eq:
            description: GPU VRAM manufacturing embodied carbon per GPU
            unit: kgCO2eq

    gpu-embodied-per-gpu-kg:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - chip_embodied_kgco2eq
          - vram_embodied_kgco2eq
        output-parameter: gpu_embodied_kgco2eq_per_gpu
      parameter-metadata:
        outputs:
          gpu_embodied_kgco2eq_per_gpu:
            description: Total GPU embodied carbon per GPU (chip + VRAM)
            unit: kgCO2eq

    gpu-embodied-node-kg:
      path: builtin
      method: Multiply
      config:
        input-parameters:
          - gpu_embodied_kgco2eq_per_gpu
          - gpu_count
        output-parameter: gpu_embodied_kgco2eq_node
      parameter-metadata:
        outputs:
          gpu_embodied_kgco2eq_node:
            description: Total GPU embodied carbon for all GPUs on this node
            unit: kgCO2eq

    gpu-embodied-node-g:
      path: builtin
      method: Coefficient
      config:
        input-parameter: gpu_embodied_kgco2eq_node
        coefficient: 1000
        output-parameter: gpu_embodied_gco2eq
      parameter-metadata:
        outputs:
          gpu_embodied_gco2eq:
            description: Total GPU embodied carbon for all GPUs on this node
            unit: gCO2eq

    sum-carbon:
      path: builtin
      method: Sum
      config:
        input-parameters:
          - carbon_operational
          - carbon_embodied
          - gpu_embodied_gco2eq
        output-parameter: carbon
      parameter-metadata:
        outputs:
          carbon:
            description: Total carbon emissions (operational + CPU/server embodied + GPU embodied)
            unit: gCO2eq
            aggregation-method:
              time: sum
              component: sum

tree:
  children:
    ~: ~
